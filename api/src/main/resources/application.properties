spring.application.name=startup
server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/startup}
spring.datasource.username=${DATABASE_USERNAME:startup}
spring.datasource.password=${DATABASE_PASSWORD:startup}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

api.security.token.secret=${JWT_SECRET:startup-dev-only-change-me}
