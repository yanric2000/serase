services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: startup
      POSTGRES_USER: startup
      POSTGRES_PASSWORD: startup
    ports:
      - "5432:5432"
    volumes:
      - startup-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U startup -d startup"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/startup
      DATABASE_USERNAME: startup
      DATABASE_PASSWORD: startup
      JWT_SECRET: ${JWT_SECRET:-startup-dev-only-change-me}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  startup-postgres:
